<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E0A5" />
      <stop offset="40%" stop-color="#D6B477" />
      <stop offset="100%" stop-color="#A77C36" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F1D" />
      <stop offset="100%" stop-color="#080A0A" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#darkGrad)" stroke="#D6B477" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Isometric 3D Layered F Cube -->
  <path d="M32 10 L50 20 L50 42 L32 52 L14 42 L14 20 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="1 3" stroke-opacity="0.6"/>
  <!-- Top Face -->
  <polygon points="32,16 46,24 32,32 18,24" fill="url(#goldGrad)" fill-opacity="0.25" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Left Face -->
  <polygon points="18,24 32,32 32,48 18,40" fill="#0D100F" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Right Face -->
  <polygon points="32,32 46,24 46,40 32,48" fill="#141816" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- 3D Layer Slices Motif -->
  <line x1="22" y1="31" x2="28" y2="34.5" stroke="#D6B477" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="36" x2="28" y2="39.5" stroke="#D6B477" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="36" y1="34.5" x2="42" y2="31" stroke="#D6B477" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="36" y1="39.5" x2="42" y2="36" stroke="#D6B477" stroke-width="1.8" stroke-linecap="round"/>
</svg>
